<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Pokémon</title>
    <link rel="stylesheet" href="stylesj5.css">
</head>
<body>
    <!-- Nombre: Quispe Huanca Carlos Daniel | C.I.: 12345678 -->
    <div class="container">
        <h1>Galería Pokémon</h1>
        <p class="autor">Estudiante: Quispe Huanca Carlos Daniel - C.I.: 12345678</p>
        
        <div class="filtros">
            <input type="text" id="filtroNombre" placeholder="Filtrar por nombre...">
            <button onclick="aplicarFiltro()">Filtrar</button>
            <button onclick="limpiarFiltro()">Limpiar</button>
        </div>
        
        <div id="galeria" class="galeria">
            <p class="loading">Cargando Pokémon...</p>
        </div>
        
        <div class="paginacion">
            <button onclick="cambiarPagina(-1)" id="btnAnterior">← Anterior</button>
            <span id="infoPagina">Página 1</span>
            <button onclick="cambiarPagina(1)" id="btnSiguiente">Siguiente →</button>
        </div>
    </div>

    <script src="scriptj5.js"></script>
</body>
</html>
